<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Codexチャット</title>
  <link rel="stylesheet" href="style.css">
  <script src="ui.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div class="connection">
        <span id="status" data-testid="status" role="status"></span>
        <button id="connect" data-testid="connect" type="button" hidden>再接続</button>
      </div>
      <button id="new-chat" data-testid="new-chat" type="button">新しいチャット</button>
    </header>
    <div id="notice" data-testid="notice" role="alert" hidden></div>
    <p id="settings-note" data-testid="settings-note" role="status" hidden>開始時の設定が変更されています。新しいチャットから適用します。</p>
    <section id="conversation" data-testid="conversation" aria-label="会話" tabindex="0">
      <p id="empty">Codexに相談する内容を入力してください。</p>
      <p id="omitted" hidden>古いメッセージの表示を省略しています。</p>
      <p id="diagnostic-note" data-testid="diagnostic-note" role="status" hidden></p>
      <div id="messages"></div>
      <div id="requests" data-testid="requests"></div>
    </section>
    <form id="composer">
      <div class="composer-shell">
        <label class="sr-only" for="input">メッセージ</label>
        <textarea id="input" data-testid="input" rows="3" placeholder="AppDockの設定について相談する" aria-describedby="input-hint"></textarea>
        <div class="composer-footer">
          <button id="approval" data-testid="approval" class="approval-trigger" type="button" popovertarget="approval-menu" aria-haspopup="menu" aria-expanded="false" aria-label="承認モード">
            <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><path id="approval-icon"></path></svg>
            <span id="approval-label">Codexの設定に従う</span><span class="chevron" aria-hidden="true">⌄</span>
          </button>
          <div class="model-controls">
            <label class="compact-select"><span class="sr-only">モデル</span><select id="model" data-testid="model" aria-label="モデル"></select><span class="chevron" aria-hidden="true">⌄</span></label>
            <label class="compact-select effort-select"><span class="sr-only">思考量</span><select id="effort" data-testid="effort" aria-label="思考量"></select><span class="chevron" aria-hidden="true">⌄</span></label>
          </div>
          <button id="send" data-testid="send" class="send-button" type="submit" aria-label="送信" title="送信"><span id="send-label" class="sr-only">送信</span><svg viewBox="0 0 24 24" aria-hidden="true"><path id="send-icon" d="M12 19V5m-6 6 6-6 6 6"></path></svg></button>
        </div>
      </div>
      <span id="input-hint">Ctrl+Enterで送信・Enterで改行</span>
    </form>
    <div id="approval-menu" data-testid="approval-menu" popover="auto" role="menu" aria-label="Codexのアクションの承認方法">
      <p class="menu-heading">Codexのアクションの承認方法</p>
      <div id="approval-options"></div>
    </div>
  </main>
</body>
</html>
